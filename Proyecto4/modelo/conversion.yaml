# Conversion del modelo publicado del Proyecto 3 a la variante optimizada del edge.
# La lee `modelo/convertir.py`. Cualquier cambio de tecnica o de datos sube `variante.version`.

origen:
  # Modelo 1.0.0 del Proyecto 3 (run de MLflow seleccionado en Proyecto3/docs/selection.json).
  version_p3: 1.0.0
  run_id: 9f9b62c202f0446a8a4b411a10321eff
  checkpoint: ../Proyecto3/mlflow_snapshot/artifacts/3/9f9b62c202f0446a8a4b411a10321eff/artifacts/checkpoint/model.pt
  sha256: e4acca429ebf73d0e5a60fb0dda383a6a5322dccb1decf04b4e40ab9db989172

variante:
  version: 1.0.0-int8-e05.1
  entrada: entrada
  salida: logits
  opset: 18

cuantizacion:
  # Cuantizacion estatica post-entrenamiento con onnxruntime, formato QDQ.
  tecnica: static_post_training_quantization
  formato: QDQ
  por_canal: true
  pesos: QInt8
  # Activaciones sin signo (U8S8): es la combinacion que onnxruntime recomienda para CPU.
  # OJO: no se comporta igual en todas las CPU. En VAL-02 el mismo INT8 dio 288/292 con
  # los kernels enteros de onnxruntime en un Ryzen 5 5625U (x86 sin VNNI) y 290/292 con
  # la aritmetica de referencia del grafo. Hipotesis, aun sin confirmar: saturacion U8S8
  # en x86 sin VNNI (ver docs/comparacion-modelos.md). La cifra que cuenta es la del
  # dispositivo (ARM), que se mide en VAL-07.
  activaciones: QUInt8
  metodo_calibracion: MinMax

calibracion:
  # SOLO la particion de train del manifiesto del P3: validacion y test no intervienen.
  manifiesto: ../Proyecto3/data/manifests/m-0.1.3-s42-1/manifest.jsonl
  manifiesto_sha256: 45600f297d13f51685e051e0cbc4962beb1f7c6a4e03247cbf61a345e6fa4305
  recortes: ../Proyecto3/data/crops/0.1.3
  split: train
  muestras: 300
  semilla: 42

verificacion:
  # Comprobacion rapida de la conversion (no es la comparacion formal de calidad de VAL):
  # acuerdo de clases entre original, FP32 e INT8 sobre la validacion del P3.
  split: val
