# Barrido de F5 (T13) sobre el manifiesto congelado m-0.1.3-s42-1.
#
# 12 corridas (margen sobre las 10 que exige 3.1). Cada uno de los 7 parametros
# toma al menos 2 valores; patience, min_delta y monitor quedan en los defaults
# de TrainingConfig (5, 0.001, val_accuracy) y la semilla es la misma para que
# las diferencias salgan de los parametros. Cada entrada se valida con
# `p3.train.config.TrainingConfig` antes de encolarla.
#
# Duracion estimada con la medicion de F4 T32 (decisiones.md §7): ~13 s por
# epoca en la RTX 4060 -> <= 300 epocas en total, ~70 min sin early stopping.
