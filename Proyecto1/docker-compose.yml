services:
  mariadb:
    image: mariadb:11.4
    container_name: annotation_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-image_annotation_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_secure_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mariadb_data:/var/lib/mysql

  minio:
    # MinIO dejo de publicar sus imagenes (al 24 sep 2026 quay.io y Docker Hub
    # responden "no such manifest") y un clon limpio ya no arrancaba. Mismo
    # reemplazo que Proyecto2: `pgsty/minio`, build comunitario del mismo codigo,
    # multi-arquitectura y con `mc` incluido para el healthcheck.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: annotation_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    # `npm run up` espera con `--wait`: sin healthcheck solo esperaba a que el
    # contenedor existiera, no a que MinIO aceptara conexiones.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data

volumes:
  mariadb_data:
  minio_data:
