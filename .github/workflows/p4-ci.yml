name: P4 CI

# CI del Proyecto 4: receptor de Capturas Edge (`Proyecto4/src/p4/capturas`) y sus
# pruebas. La pagina Capturas Edge vive en `Proyecto2/web` y la cubre `ci.yml`
# (job `web`); el montaje del router en el portal, el pytest de Proyecto2.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  p4-python:
    name: P4 · Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto2/requirements.lock.txt

      # P4 no es un paquete instalable: corre dentro de la app de Proyecto2, asi que
      # sus dependencias son las del lockfile de Proyecto2 (FastAPI, boto3, Pillow,
      # pydantic-settings, pytest y ruff).
      - name: Instalar dependencias (fijadas)
        run: pip install -r ../Proyecto2/requirements.lock.txt

      # `modelo/verificar_linaje.py` (VAL-01, #1) solo lee archivos versionados del P3
      # y del P4, asi que su prueba corre aqui sin pesos ni credenciales.
      - name: Ruff (lint)
        run: ruff check src tests scripts modelo/verificar_linaje.py

      - name: Ruff (formato)
        run: ruff format --check src tests scripts modelo/verificar_linaje.py

      - name: pytest
        run: pytest
