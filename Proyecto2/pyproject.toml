[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-quality"
version = "0.1.0"
description = "Plataforma de calidad y versionado de datasets de deteccion de objetos (COCO)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "boto3>=1.35",
    "pyyaml>=6.0",
    # pHash para el analizador de duplicados. Arrastra Pillow, numpy y
    # scipy (la DCT). Se usa la libreria en vez de implementarlo a mano.
    "imagehash>=4.3",
    # Compresion del artefacto de release (Frente 6, `dq release`). No es lo
    # mismo que `dvc[s3]`: esa es la herramienta de pipeline, esta es la
    # libreria que empaqueta el `.tar.zst` que sube `tiers/release.py`.
    "zstandard>=0.22",
    # El Copilot usa Gemini para orquestar herramientas y el SDK oficial de
    # MCP para hablar con el sidecar interno de solo lectura.
    "google-genai>=1.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]
# `dvc` orquesta el pipeline (`dvc.yaml`) y empuja/trae datos hacia los
# remotes S3; ningun modulo de `dataset_quality` lo importa, por eso vive
# aparte de `dependencies` en vez de junto a boto3/pydantic.
pipeline = [
    "dvc[s3]>=3.55",
]

[project.scripts]
dq = "dataset_quality.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_quality"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `../Proyecto3/src` y `../Proyecto4/src`: la app monta los routers de P3 y P4.
pythonpath = ["src", "../Proyecto3/src", "../Proyecto4/src"]
addopts = "-q"
